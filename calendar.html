<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Escuchas - Last.fm Stats</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
              font-size: 0.95em;
            opacity: 0.9;
        }
        
        .calendar-grid {
            display: grid;
                grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
                gap: 8px;
                margin-bottom: 30px;
        }
        
        .day-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .day-card:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .day-date {
            position: absolute;
                top: 4px;
                left: 4px;
                background: rgba(0,0,0,0.8);
                color: white;
                padding: 2px 6px;
                border-radius: 3px;
                font-size: 0.65em;
            font-weight: bold;
            z-index: 10;
        }
        
        .day-image {
            width: 100%;
                height: 80px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .day-image.no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
                font-size: 0.7em;
            text-align: center;
                padding: 5px;
        }
        
        .day-info {
            padding: 6px;
            background: white;
        }
        
        .day-artist {
            font-weight: bold;
                font-size: 0.75em;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
                margin-bottom: 2px;
        }
        
        .day-track {
            font-size: 0.7em;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        
        .day-plays {
            font-size: 0.65em;
            color: #999;
            text-align: right;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-image {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .modal-date {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 10px;
        }
        
        .modal-artist {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .modal-track {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .modal-plays {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 15px;
        }
        
        .modal-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            transition: transform 0.2s;
            font-size: 0.9em;
        }
        
        .modal-link:hover {
            transform: scale(1.05);
        }
        
        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 2em;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .close:hover {
            color: #333;
        }
        
        .stats {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: #666;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .stats p {
            font-size: 1.1em;
            margin: 5px 0;
        }
    </style>
</head>

            const regularity = summary.top_tracks_regularity||[];
            if (regularity.length>0){
                html += '<div style="margin-bottom:16px; padding:12px; background:#f9f9f9; border-left:4px solid #2f855a; border-radius:4px;"><strong style="color:#2f855a;">CANCIONES MAS REGULARES</strong><ol style="margin:8px 0 0 20px;">';
                for (const item of regularity){
                    const artist = item[0][0]||'';
                    const track = item[0][1]||'';
                    html += '<li><strong>'+track+'</strong><br/><small>por '+artist+' · '+item[1]+'/100 · '+item[2]+' de '+item[3]+' días · '+item[4]+' escuchas</small></li>';
                }
                html += '</ol></div>';
            }
            
            html += '</div>';
            document.getElementById('summary-container').innerHTML = html;
            try { renderHourlyChart(summary.hourly_top || {}); } catch(e){ console.warn('hourly chart error', e); }
            renderCalendarForYearSimple((summary._config && summary._config.split_by_year) ? currentYear : null);
        }

        function renderCurrentView(){
            const globalSummary = currentMetric === 'time' ? summaryTimeData : summaryData;
            const yearlySummaries = currentMetric === 'time' ? summaryByYearTime : summaryByYear;
            const selectedSummary = currentYear === null ? globalSummary : yearlySummaries[String(currentYear)];
            renderFullPage(selectedSummary || globalSummary);
        }

        function renderSummary(summary){
            if (!summary) return;
            const config = summary._config || {};
            const controls = document.createElement('div');
            controls.id = 'viewControls';
            controls.style = 'display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:18px;color:white;';

            const metricLabel = document.createElement('label');
            metricLabel.textContent = 'Métrica ';
            const metricSelect = document.createElement('select');
            metricSelect.id = 'metricSelect';
            metricSelect.innerHTML = '<option value="plays">Número de escuchas</option><option value="time">Tiempo estimado</option>';
            metricSelect.value = currentMetric;
            metricSelect.onchange = function(){ currentMetric = this.value; renderCurrentView(); };
            metricLabel.appendChild(metricSelect);
            controls.appendChild(metricLabel);

            if (config.split_by_year){
                const yearLabel = document.createElement('label');
                yearLabel.textContent = 'Período ';
                const yearSelect = document.createElement('select');
                yearSelect.id = 'yearSelect';
                yearSelect.innerHTML = '<option value="all">Todos los años</option>';
                const years = Array.from(new Set([
                    ...Object.keys(summaryByYear || {}),
                    ...Object.keys(summaryByYearTime || {}),
                    ...Object.keys(trackByYear || {})
                ])).sort((a,b)=>Number(b)-Number(a));
                for (const year of years){
                    const option = document.createElement('option');
                    option.value = year;
                    option.textContent = year;
                    yearSelect.appendChild(option);
                }
                yearSelect.value = 'all';
                yearSelect.onchange = function(){ currentYear = this.value === 'all' ? null : this.value; renderCurrentView(); };
                yearLabel.appendChild(yearSelect);
                controls.appendChild(yearLabel);
            }

            const header = document.querySelector('.header');
            if (header) header.parentNode.insertBefore(controls, header.nextSibling);
            currentYear = null;
            renderCurrentView();
        }

        // Inicialización
        let currentYear = null;
        renderSummary(summaryData);
        // Si no split, asegurarse de renderizar calendario completo
        const splitEnabled = (summaryData && summaryData._config && summaryData._config.split_by_year);
        if (!splitEnabled) renderCalendarAllDays();
        document.getElementById('modal').onclick = function(ev){ if (ev.target === this) closeModal(); };
    </script>
</body>
</html>
